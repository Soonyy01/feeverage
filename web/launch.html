<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launch · Feeverage</title>
<script>try{var t=localStorage.getItem("feev.theme");if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem("feev.lang");if(l!=="en"&&l!=="zh")l=(navigator.language||"").toLowerCase().indexOf("zh")===0?"zh":"en";document.documentElement.lang=l;}catch(e){}</script>
<meta name="description" content="Launch a token on BNB Chain. Its trading fees fund a leveraged Hyperliquid position.">
<meta name="theme-color" content="#f4f2e8">
<meta property="og:title" content="Feeverage — your token's fees. Leveraged.">
<meta property="og:description" content="Launch a token on BNB Chain. Its trading fees fund a leveraged Hyperliquid position.">
<meta property="og:image" content="assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Feeverage home">
      <img src="assets/logo-96.png" alt="" width="40" height="40">
      <span>FEEVERAGE</span>
    </a>
    <div class="actions">
      <button class="btn" id="walletBtn" type="button" aria-expanded="false" aria-controls="walletMenu" data-i18n="m.connect">Connect wallet</button>
      <button class="btn menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu"><span class="burger" aria-hidden="true"></span><span data-i18n="menu">Menu</span></button>
    </div>
    <div class="menu wallet-menu" id="walletMenu" hidden></div>
    <div class="menu" id="menu" hidden></div>
  </div>
</header>

<div class="ticker" aria-label="Live prices">
  <div class="track" id="ticker"></div>
</div>

<main>
  <div class="wrap">
    <section class="page-head" id="launch">
      <div class="sec-head">
        <div><span class="label muted" data-i18n="l.kicker">New token</span><h1 class="echo-h" data-i18n="l.title">Launch</h1></div>
        <span class="pill label" id="gate"><span class="sq"></span>…</span>
      </div>

      <div class="launch">
        <form class="panel" id="launchForm" novalidate>
          <fieldset>
            <legend class="label" data-i18n="l.token">Token</legend>
            <div class="row">
              <label class="f" for="name"><span data-i18n="l.name">Name</span> <input id="name" type="text" maxlength="64" placeholder="Feeverage" required></label>
              <label class="f" for="symbol"><span data-i18n="l.ticker">Ticker</span> <input id="symbol" type="text" maxlength="16" placeholder="FEEV" required></label>
            </div>
            <div style="display:grid;gap:8px">
              <span style="font-size:13.5px;font-weight:700" data-i18n="l.logo">Logo</span>
              <label class="drop" id="drop" for="logoFile">
                <span class="prev" id="logoPrev"></span>
                <span class="drop-text"><b id="dropTitle" data-i18n="l.logo.s">Drop an image here or tap to choose</b><small id="dropState" class="muted"></small></span>
                <input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
              </label>
            </div>
            <label class="f" for="desc"><span data-i18n="l.desc">Description</span>
              <textarea id="desc" maxlength="1900" data-i18n-ph="l.desc.ph"></textarea></label>
            <div class="row">
              <label class="f" for="x">X / Twitter <input id="x" type="url" maxlength="256" placeholder="https://x.com/…"></label>
              <label class="f" for="tg">Telegram <input id="tg" type="url" maxlength="256" placeholder="https://t.me/…"></label>
            </div>
            <label class="f" for="web"><span data-i18n="l.web">Website</span> <input id="web" type="url" maxlength="256" placeholder="https://…"></label>
          </fieldset>

          <fieldset>
            <legend class="label" data-i18n="l.position">Position</legend>
            <div style="display:grid;gap:8px">
              <span id="marketLbl" style="font-size:13.5px;font-weight:700" data-i18n="l.market">Hyperliquid market</span>
              <div class="picker" id="markets" role="group" aria-labelledby="marketLbl"></div>
            </div>
            <div class="seg" role="group" aria-label="Direction">
              <button type="button" data-side="long" aria-pressed="true">▲ LONG</button>
              <button type="button" data-side="short" aria-pressed="false">▼ SHORT</button>
            </div>
            <label class="f" for="lev">
              <span class="lev-read"><span data-i18n="l.lev">Leverage</span><span class="num" id="levOut">5×</span></span>
              <input id="lev" type="range" min="1" max="20" step="1" value="5">
            </label>
          </fieldset>

          <fieldset>
            <legend class="label" data-i18n="l.launch">Launch</legend>
            <div class="row">
              <label class="f" for="buy"><span data-i18n="l.buy">Your first buy</span> <small data-i18n="l.buy.s"></small>
                <input id="buy" type="number" min="0" step="0.001" placeholder="0"></label>
              <label class="f" for="tax"><span data-i18n="l.tax">Trade tax</span>
                <select id="tax"></select></label>
            </div>
          </fieldset>

          <button class="btn dark" id="launchBtn" type="submit" style="width:100%;padding:17px;font-size:17px" data-i18n="l.go">Launch token</button>
          <div class="status" id="launchStatus" role="status"></div>
        </form>

        <aside class="panel summary" aria-live="polite">
          <div>
            <span class="label muted" data-i18n="l.summary">Summary</span>
            <h3 id="sumTitle" style="margin-top:8px">FEEV → 5× long BTC</h3>
          </div>
          <div class="fig">
            <span class="label" data-i18n="fig.title">Margin / Notional</span>
            <div class="bar"><i class="y"></i></div>
            <div class="bar" id="sumBars"></div>
            <div class="ruler" aria-hidden="true"></div>
            <div class="row2 label"><span id="figLeft">$1 → $5 BTC</span><span id="figRight">5× long</span></div>
          </div>
          <dl class="kv">
            <dt data-i18n="l.fee">Trade tax</dt><dd id="sumFee">—</dd>
            <dt data-i18n="l.first">Your first buy</dt><dd id="sumBuy">—</dd>
            <dt class="total" data-i18n="l.send">You send</dt><dd class="total" id="sumTotal">—</dd>
          </dl>
          <dl class="kv">
            <dt data-i18n="l.per100">Every $100 of fees opens</dt><dd id="sumExp">—</dd>
            <dt data-i18n="l.toliq">Move to liquidation</dt><dd id="sumLiq">—</dd>
            <dt><span id="markLbl">BTC</span> <span data-i18n="l.mark">mark</span></dt><dd id="sumMark">—</dd>
          </dl>
        </aside>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <img src="assets/logo-96.png" alt="" width="36" height="36">
    <span class="label">BNB Chain × Hyperliquid</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script type="module" src="launch.js"></script>
</body>
</html>
