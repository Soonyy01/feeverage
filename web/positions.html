<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Positions · Feeverage</title>
<script>try{var t=localStorage.getItem("feev.theme");if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem("feev.lang");if(l!=="en"&&l!=="zh")l=(navigator.language||"").toLowerCase().indexOf("zh")===0?"zh":"en";document.documentElement.lang=l;}catch(e){}</script>
<meta name="description" content="Launch a token on Robinhood Chain. Its trading fees fund a leveraged Hyperliquid position.">
<meta name="theme-color" content="#f4f2e8">
<meta property="og:title" content="Feeverage — your token's fees. Leveraged.">
<meta property="og:description" content="Launch a token on Robinhood Chain. Its trading fees fund a leveraged Hyperliquid position.">
<meta property="og:image" content="assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Feeverage home">
      <img src="assets/logo-96.png" alt="" width="40" height="40">
      <span>FEEVERAGE</span>
    </a>
    <div class="actions">
      <button class="btn" id="walletBtn" type="button" aria-expanded="false" aria-controls="walletMenu" data-i18n="m.connect">Connect wallet</button>
      <button class="btn menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu"><span class="burger" aria-hidden="true"></span><span data-i18n="menu">Menu</span></button>
    </div>
    <div class="menu wallet-menu" id="walletMenu" hidden></div>
    <div class="menu" id="menu" hidden></div>
  </div>
</header>

<div class="ticker" aria-label="Live prices">
  <div class="track" id="ticker"></div>
</div>

<main>
  <div class="wrap">
    <section class="page-head">
      <div class="sec-head">
        <div><span class="label muted" data-i18n="p.kicker">Your wallet</span><h1 class="echo-h" data-i18n="p.title">Positions</h1></div>
        <span class="pill label" id="who" hidden></span>
      </div>

      <div class="empty" id="needWallet" hidden>
        <p style="max-width:52ch;margin:0 auto" data-i18n="p.connect"></p>
        <p style="margin-top:18px"><button class="btn" id="connectHere" type="button" data-i18n="m.connect">Connect wallet</button></p>
      </div>

      <div id="mine" hidden>
        <div class="stats" id="pstats" role="list" style="grid-template-columns:repeat(4,1fr)">
          <div class="stat hl" role="listitem"><span class="label" data-i18n="p.eth">ETH balance</span><span class="v" id="ethBal">—</span><span class="s" id="ethBalUsd">—</span></div>
          <div class="stat" role="listitem"><span class="label" data-i18n="p.value">Holdings value</span><span class="v" id="hVal">—</span><span class="s" data-i18n="p.value.s">marked to live price</span></div>
          <div class="stat" role="listitem"><span class="label" data-i18n="p.cost">Total spent</span><span class="v" id="hCost">—</span><span class="s" data-i18n="p.cost.s">on Feeverage curves</span></div>
          <div class="stat" role="listitem"><span class="label" data-i18n="p.pnl">Total PnL</span><span class="v" id="hPnl">—</span><span class="s" id="hPnlPct" data-i18n="p.pnl.s">realized + unrealized</span></div>
        </div>
        <p class="label muted" id="pStatus" style="margin-top:12px"></p>

        <div class="sec-head" style="margin-top:48px"><div><h2 class="echo-h" style="font-size:clamp(28px,4vw,42px)" data-i18n="p.holdings">Holdings</h2></div></div>
        <div id="holdings"></div>
        <p class="note" style="margin-top:12px" data-i18n="p.note"></p>

        <div class="sec-head" style="margin-top:48px"><div><h2 class="echo-h" style="font-size:clamp(28px,4vw,42px)" data-i18n="p.history">Your trades</h2></div></div>
        <div id="history"></div>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <img src="assets/logo-96.png" alt="" width="36" height="36">
    <span class="label">Robinhood × Hyperliquid</span>
    <span class="label muted" style="margin-left:auto" data-i18n="foot.risk">Experimental. Leverage can go to zero.</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script type="module" src="positions.js"></script>
</body>
</html>
