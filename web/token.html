<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Token · Feeverage</title>
<script>try{var t=localStorage.getItem("feev.theme");if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem("feev.lang");if(l!=="en"&&l!=="zh")l=(navigator.language||"").toLowerCase().indexOf("zh")===0?"zh":"en";document.documentElement.lang=l;}catch(e){}</script>
<meta name="description" content="Launch a token on Robinhood Chain. Its trading fees fund a leveraged Hyperliquid position.">
<meta name="theme-color" content="#f4f2e8">
<meta property="og:title" content="Feeverage — your token's fees. Leveraged.">
<meta property="og:description" content="Launch a token on Robinhood Chain. Its trading fees fund a leveraged Hyperliquid position.">
<meta property="og:image" content="assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Feeverage home">
      <img src="assets/logo-96.png" alt="" width="40" height="40">
      <span>FEEVERAGE</span>
    </a>
    <div class="actions">
      <button class="btn" id="walletBtn" type="button" aria-expanded="false" aria-controls="walletMenu" data-i18n="m.connect">Connect wallet</button>
      <button class="btn menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu"><span class="burger" aria-hidden="true"></span><span data-i18n="menu">Menu</span></button>
    </div>
    <div class="menu wallet-menu" id="walletMenu" hidden></div>
    <div class="menu" id="menu" hidden></div>
  </div>
</header>

<div class="ticker" aria-label="Live prices">
  <div class="track" id="ticker"></div>
</div>

<main>
  <div class="wrap">
    <section class="page-head">
      <a class="label" href="index.html#tokens" data-i18n="t.back">← All tokens</a>
      <div class="empty" id="missing" hidden style="margin-top:22px"><h3 data-i18n="t.missing">Token not found</h3><p class="muted" style="margin-top:8px" data-i18n="t.missing.p"></p></div>
      <div id="page">
        <div class="tok-hero" id="hero"><span class="tlogo">…</span><div><h1>…</h1></div></div>
        <div class="tok-grid">
          <div style="display:grid;gap:24px;min-width:0">
            <div class="panel health" id="healthBox">
              <svg viewBox="0 0 130 76" aria-hidden="true">
                <path d="M10 70 A55 55 0 0 1 120 70" fill="none" stroke="var(--hair)" stroke-width="12"/>
                <path d="M10 70 A55 55 0 0 1 32 26" fill="none" stroke="var(--down)" stroke-width="12"/>
                <path d="M32 26 A55 55 0 0 1 65 15" fill="none" stroke="var(--yellow)" stroke-width="12"/>
                <path d="M65 15 A55 55 0 0 1 120 70" fill="none" stroke="var(--up)" stroke-width="12"/>
                <line id="needle" x1="65" y1="70" x2="65" y2="22" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" style="transform-origin:65px 70px;transition:transform .6s cubic-bezier(.2,.9,.25,1.2)"/>
                <circle cx="65" cy="70" r="6" fill="var(--ink)"/>
              </svg>
              <div style="min-width:0">
                <span class="label muted" data-i18n="t.health">Health</span>
                <div class="word" id="hWord" style="margin-top:6px">—</div>
                <div class="label" id="hDist" style="margin-top:6px"></div>
              </div>
            </div>
            <dl class="mstats" id="mstats"></dl>
            <div class="panel" style="display:grid;gap:10px">
              <div class="row2"><span class="label" data-i18n="t.next">Next top-up</span><span class="label" id="nextTxt">—</span></div>
              <div class="meter" style="height:14px"><i id="nextBar" style="width:0"></i></div>
              <div class="row2" style="margin-top:8px"><span class="label" data-i18n="t.curve">Bonding curve</span><span class="label" id="curvePct">—</span></div>
              <div class="meter" style="height:14px"><i id="curveBar" style="width:0"></i></div>
              <span class="label muted" id="curveText"></span>
            </div>
            <div class="panel"><span class="label" data-i18n="t.about">About</span><p class="desc" id="desc" style="margin-top:10px"></p></div>
          </div>
          <aside class="panel" style="display:grid;gap:14px">
            <div id="youBox" hidden style="display:grid;gap:10px">
              <span class="label" data-i18n="t.you">Your position</span>
              <dl class="you" id="you" style="margin:0"></dl>
            </div>
            <span class="label" data-i18n="t.trade">Trade</span>
            <div id="trade" style="display:grid;gap:14px">
              <div class="seg" role="group" aria-label="Trade side"><button type="button" data-t="buy" aria-pressed="true" data-i18n="t.buy">Buy</button><button type="button" data-t="sell" aria-pressed="false" data-i18n="t.sell">Sell</button></div>
              <label class="f" for="tAmt"><span id="tAmtLbl" data-i18n="t.pay">Pay (ETH)</span><input id="tAmt" type="number" min="0" step="0.001" placeholder="0.001"></label>
              <div class="label muted" id="tQuote" data-i18n="t.quote">Enter an amount</div>
              <button class="btn dark" id="tGo" type="button" style="width:100%" data-i18n="t.buy">Buy</button>
            </div>
            <p class="note" id="gradNote" hidden data-i18n="t.grad"></p>
            <button class="btn ghost" id="push" type="button" hidden data-i18n="t.push">Push fees to the position</button>
            <div class="status" id="tStatus"></div>
            <dl class="kv" id="links"></dl>
          </aside>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <img src="assets/logo-96.png" alt="" width="36" height="36">
    <span class="label">Robinhood × Hyperliquid</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script type="module" src="token.js"></script>
</body>
</html>
